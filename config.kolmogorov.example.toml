# Copy this file to config.kolmogorov.local.toml for machine-specific settings.
# The local copy is ignored by Git.

mhdflows_project = "MHDFlows_dev-main"
athena_project = "../athena"
athena_work_root = "athena_work"
output_root = "outputs"
output_by_backend = true
backend = "mhdflows" # mhdflows or athena; run.sh can override this.
device = "auto" # auto, cpu, or gpu

name = "kolmogorov_hd"
description = "2D incompressible Kolmogorov flow: f_x = 0.1 sin(4*pi*y), f_y = 0"

nx = 128
ny = 128
# MHDFlows uses a 3D grid constructor that requires every dimension to be even.
# nz = 2 is a degenerate z embedding; the initial condition and forcing are
# z-independent, so the intended dynamics remain 2D.
nz = 2
domain_length = 1.0
float_type = "Float32"

# Paper setup: Re = 1e6, so viscosity = 1 / Re.
reynolds_number = 1000000.0
viscosity = 0.000001

force_amplitude = 0.1
force_mode_y = 2

# MHDFlows' HD path always constructs a grid with its default dealiasing,
# which is tuned for a 2*pi box. For the paper's [0, 1]^2 domain it removes
# the low physical modes, so this runner installs a runtime shim that skips
# package-level dealiasing for this side run.
disable_package_dealiasing = true

# Initial condition options:
# - fourier_divfree: random low-mode divergence-free field, normalized to
#   initial_velocity_rms.
# - grid_noise: independent centered random velocity at each (x, y) grid point,
#   copied through the degenerate z direction and scaled by
#   grid_noise_velocity_amplitude. This is not divergence-free.
initial_condition = "fourier_divfree"
initial_velocity_rms = 0.001
grid_noise_velocity_amplitude = 0.1
initial_modes = 4

# Keep a fixed timestep. The package's generic adaptive CFL estimate is not
# conservative enough for this high-Reynolds-number 2D benchmark.
fixed_dt = 0.001
end_time = 5.0
max_steps = 100000
snapshot_dt = 0.5
diagnostics_sample_every = 10
plot_after_run = true
reuse_existing_data = true

seed = 1234
tag_suffix = ""

# Athena++ backend knobs. Athena++ is a compressible hydro code; this backend uses
# non-magnetic low-Mach isothermal hydro with constant viscosity as a sanity-check proxy.
# Raising c_s suppresses density variation but reduces the CFL timestep.
athena_iso_sound_speed = 10.0
athena_cfl_number = 0.3
athena_configure_args = ["--eos=isothermal", "--flux=hlle"]
athena_make_jobs = 4
athena_prepare_only = false
athena_skip_build = false
athena_skip_run = false
