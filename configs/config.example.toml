# Copy this file to config.local.toml for machine-specific settings.
# config.local.toml is ignored by Git.

# External package checkout. Relative paths are resolved from this repository.
mhdflows_project = "MHDFlows_dev-main"
athena_project = "athena"

# Solver backend: "mhdflows" or "athena".
solver = "mhdflows"

# Simulation outputs. Relative paths are resolved from this repository.
output_root = "outputs"

# Runtime device: "auto", "cpu", or "gpu".
device = "auto"

# Keep true for CPU-only machines using the current upstream MHDFlows checkout.
# This modifies the problematic CPU method in memory only; it does not edit the
# external MHDFlows package on disk.
apply_cpu_compatibility_shim = true

name = "compressible_mhd_baseline"
description = "Compressible MHD baseline with snapshots and energy-history support metrics"
tag_suffix = ""

nx = 128
box_size = 6.283185307179586
float_type = "Float32"
sound_speed = 1.4142135623730951 # higher values lower sonic Mach for fixed turbulence
viscosity = 0.01
resistivity = 0.01
mean_field = [1.0, 0.0, 0.0] # stronger guide field lowers mean-field Alfven Mach

forcing_wavenumber = 2.0
forcing_power = 8000.0 # stronger forcing usually raises both sonic and Alfven Mach
forcing_width = 1.0
initial_velocity_power = 0.0005

# Set fixed_dt = 0.0 to use the solver's adaptive CFL timestep.
fixed_dt = 0.0
end_time = 60.0
max_steps = 80000
snapshot_dt = 5.0

energy_sample_every = 10
late_window_fraction = 0.25
stability_rel_band = 0.12
stability_abs_change = 0.06

seed = 1234

# Athena++ reference-run settings. These are ignored by the MHDFlows runner.
# The default generated Athena input uses the repo-owned
# athena_pgen/mhdflows_turbulence.cpp problem generator. The runner copies the
# external Athena checkout into build/ first, so the original checkout is not
# modified.
athena_executable = "bin/athena"
athena_problem = "mhdflows_turbulence"
athena_input_template = ""
athena_problem_id = ""
athena_parse_only = false
athena_dry_run = false

athena_use_build_copy = true
athena_build_copy = "build/athena_mhdflows"
athena_refresh_build_copy = false
athena_pgen_source = "athena_pgen/mhdflows_turbulence.cpp"
athena_patch_fp16 = true # Patch copied Athena src/athena.hpp for GCC/_Float16 builds.
athena_configure = true
athena_make = true
athena_configure_args = ["-b", "--prob=mhdflows_turbulence", "--eos=isothermal", "-hdf5", "-fft", "-omp"]
athena_make_args = ["-j", "4"]
athena_run_args = []

# Hybrid CPU parallelism. OpenMP works with the default build. For MPI, set
# athena_mpi_ranks > 1, add "-mpi" to athena_configure_args, and split the
# domain into at least one meshblock per CPU thread across all MPI ranks.
athena_mpi_ranks = 1
athena_mpi_launcher = "mpirun"
athena_mpi_args = []

athena_cfl_number = 0.4
athena_integrator = "vl2"
athena_xorder = 2
athena_num_threads = 4 # OpenMP threads per MPI rank; tune for the machine.
athena_nx1 = 0 # 0 means use nx
athena_nx2 = 0 # 0 means use nx
athena_nx3 = 0 # 0 means use nx
athena_meshblock_nx1 = 64 # 128^3 default -> 8 meshblocks for CPU load balancing
athena_meshblock_nx2 = 64
athena_meshblock_nx3 = 64
athena_box_size = 0.0 # 0 means use box_size
athena_history_dt = 0.0 # 0 chooses a reasonable value from end_time/snapshot_dt
athena_hdf5_dt = 0.0 # 0 means use snapshot_dt
athena_output_variable = "prim"
athena_hdf5_data_format = "float32"
athena_turb_flag = 3 # 3 = continuously driven Athena turbulence
athena_tcorr = 0.0 # 0 chooses athena_history_dt
athena_dtdrive = 0.0 # used only for impulsive driving; 0 chooses athena_history_dt
athena_f_shear = 1.0 # solenoidal fraction; MHDFlows initial seed is divergence-free
